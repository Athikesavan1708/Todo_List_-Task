<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏷️Task Manager Dashboard</title>

    <link rel="stylesheet" href="Style.css">
</head>
<body>

    <h1>Task Manager Dashboard</h1>

<div class="task-container">

        <h2>ToDo List</h2>

        <input
            type="text"
            id="taskInput"
            placeholder="Enter your task"
        >

        <button id="addTaskBtn">Add Task</button>

        <ul id="taskList">
            <!-- Tasks will be added here using JavaScript -->
        </ul>

<br><br>
    <div class="task-counters">
        <p>Total Tasks: <span id="totalTasks">0</span></p>
        <p>Completed: <span id="completedTasks">0</span></p>
        <p>Pending: <span id="pendingTasks">0</span></p>
    </div>

    <button id="clearCompletedBtn">Clear Completed</button>

</div>

    <script src="scor.js"></script>

</body>
</html>
